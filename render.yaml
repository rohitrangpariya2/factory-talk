services:
  - type: web
    name: factory-talk-server
    runtime: docker
    rootDir: server
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FIREBASE_PROJECT_ID
        value: factory-talk
      - key: ALLOW_DEVICE_AUTH
        value: "true"
      - key: STUN_SERVER
        value: stun:stun.l.google.com:19302
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
